<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Emergency Mesh</title>
  <style>
    body{margin:0;background:#10212d;color:#fff;font-family:Arial,sans-serif;font-size:18px}
    .card{max-width:520px;margin:0 auto;padding:24px 18px 36px}
    h1{font-size:30px;margin:0 0 8px}
    .status{background:#1e7d42;border-radius:8px;padding:12px;margin:16px 0 20px;font-weight:bold}
    .note{line-height:1.45;margin:0 0 24px;color:#d8e7ef}
    label{display:block;font-weight:bold;margin:18px 0 7px}
    input,textarea,button{box-sizing:border-box;width:100%;font:inherit;border-radius:8px}
    input,textarea{padding:14px;border:2px solid #d8e7ef;background:#fff;color:#101820}
    textarea{min-height:132px;resize:vertical}
    .count{text-align:right;margin:6px 0 20px;color:#d8e7ef;font-size:15px}
    button{padding:16px;border:0;background:#1976d2;color:#fff;font-weight:bold;font-size:21px;min-height:56px}
    button:active{background:#125aa0}
    .small{font-size:14px;color:#d8e7ef;margin-top:18px;line-height:1.35}
  </style>
</head>
<body>
  <main class="card">
    <h1>Send an emergency message</h1>
    <div class="status">Connected to Emergency-Mesh</div>
    <p class="note">Your message will be sent through the local emergency network.</p>

    <form action="/send" method="post" accept-charset="US-ASCII">
      <label for="sender">Your name (optional)</label>
      <input id="sender" name="sender" type="text" maxlength="20"
             autocomplete="name" autocapitalize="words">

      <label for="message">Message</label>
      <textarea id="message" name="message" maxlength="64"
                required aria-describedby="counter"></textarea>
      <div class="count" id="counter">0/64</div>

      <button type="submit">Send message</button>
    </form>

    <p class="small">No internet connection is required.</p>
  </main>

  <script>
    (function () {
      var message = document.getElementById("message");
      var counter = document.getElementById("counter");

      function updateCounter() {
        counter.innerHTML = message.value.length + "/64";
      }

      message.oninput = updateCounter;
      message.onkeyup = updateCounter;
      updateCounter();
    }());
  </script>
</body>
</html>
